name: CI

# 목적: 고친 코드가 다른 곳을 깨뜨렸는지 사람 대신 기계가 먼저 확인합니다.
# 이 검사가 빨간불이면 배포 전에 멈추므로, 오류를 운영 중에 발견하지 않게 됩니다.
on:
  push:
    branches: [main, fix/ci-preparation-package]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 린트
        run: npm run lint

      - name: 테스트
        run: npm test

      - name: 빌드
        run: npm run build
        env:
          # 빌드 통과용 더미값. 실제 키는 Vercel 환경변수에 있습니다.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
          # 검사 중 실제 Gemini 호출이 일어나지 않도록 잠금 상태를 유지합니다.
          GEMINI_ENABLED: "false"

  apply-migrations:
    needs: verify
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: lmgzibodxozdocxocpez
    steps:
      - name: 마이그레이션 비밀값 확인
        id: credentials
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN 또는 SUPABASE_DB_PASSWORD가 없어 마이그레이션 적용을 건너뜁니다."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'

      - uses: supabase/setup-cli@v3
        if: steps.credentials.outputs.available == 'true'
        with:
          version: 3.0.0

      - name: 운영 Supabase 연결
        if: steps.credentials.outputs.available == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: 미적용 마이그레이션 적용
        if: steps.credentials.outputs.available == 'true'
        run: supabase db push --remote --yes
